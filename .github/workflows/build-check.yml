name: Build check

on:
  push:
    branches: [main, analytics-unique-replies-bookings-20261029]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Existing source has unrelated TypeScript errors; report them without blocking deploy-preview builds.
      - name: TypeScript advisory (existing baseline errors)
        continue-on-error: true
        run: npx tsc --project tsconfig.app.json --noEmit
      - name: Check Netlify function syntax
        run: |
          node --check netlify/functions/inbox-api.cjs
          node --check netlify/functions/master-inbox-sync.cjs
          node --check netlify/functions/inbox-sync.cjs
          node --check netlify/functions/lib/inbox-core.cjs
