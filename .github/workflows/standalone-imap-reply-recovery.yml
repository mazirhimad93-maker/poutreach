name: Standalone IMAP Reply Recovery

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days back to scan"
        required: true
        default: "14"
        type: string

permissions:
  contents: read

concurrency:
  group: standalone-imap-reply-recovery
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run read-only IMAP audit
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          OUTPUT_DIR: reply-recovery-output
        run: node scripts/standalone-imap-reply-recovery.mjs
      - name: Upload reply reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poutreach-imap-reply-recovery-${{ github.run_number }}
          path: reply-recovery-output/
          if-no-files-found: warn
          retention-days: 14
