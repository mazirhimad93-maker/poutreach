name: Verify Poutreach production analytics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact Poutreach public site has current analytics
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://incredible-sunflower-138395.netlify.app"
          HTML="$(mktemp)"
          ASSETS="$(mktemp)"
          trap 'rm -f "$HTML" "$ASSETS"' EXIT
          curl --fail --silent --show-error --location --retry 3 "$SITE/" -o "$HTML"
          # The Vite frontend is chunked; important code may be in an imported module.
          mapfile -t URLS < <(grep -oE '(src|href)="/assets/[^"]+\\.(js|css)"' "$HTML" | sed -E 's/^(src|href)="([^"]+)"$/\\2/' | grep -E '\\.js$' || true)
          if [ "${#URLS[@]}" -eq 0 ]; then
            echo "::error::No JavaScript assets found on the Poutreach production site"
            exit 1
          fi
          for asset in "${URLS[@]}"; do
            curl --fail --silent --show-error --location "$SITE$asset" >> "$ASSETS"
          done
          if grep -q 'Reach & Conversations' "$ASSETS" && grep -q 'Unique replied leads' "$ASSETS"; then
            echo "Poutreach production includes the corrected analytics"
          else
            echo "::error::Poutreach is serving an older frontend. GitHub main includes updated analytics but Netlify has not published them."
            exit 1
          fi
