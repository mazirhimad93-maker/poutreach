name: Live production health

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect skipped production build details
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ID="6aaf42fd05de420009e53ab7"
          BUILD_ID="6aaf42fd05de420009e53ab5"

          echo "--- deploy details ---"
          curl -sS -i "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID" | head -n200 || true

          echo "--- build details ---"
          curl -sS -i "https://api.netlify.com/api/v1/builds/$BUILD_ID" | head -n240 || true

          echo "--- build log ---"
          curl -sS -i "https://api.netlify.com/api/v1/builds/$BUILD_ID/log" | head -n240 || true
