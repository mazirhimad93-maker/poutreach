name: Live production health

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Netlify production and API metadata
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://glistening-donut-beee31.netlify.app"
          SITE_ID="bf49043f-df08-42d1-a5a5-32a26ea446f8"

          echo "--- public site headers ---"
          curl -sS -D - -o /dev/null "$SITE/booked" | head -n80 || true

          echo "--- ping function ---"
          curl -sS -i "$SITE/.netlify/functions/poutreach-ping" | head -n80 || true

          echo "--- Netlify site API without auth ---"
          curl -sS -i "https://api.netlify.com/api/v1/sites/$SITE_ID" | head -n120 || true

          echo "--- Netlify deploys API without auth ---"
          curl -sS -i "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys?per_page=10" | head -n160 || true
