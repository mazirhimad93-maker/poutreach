name: Manual Netlify fallback deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      VITE_SUPABASE_URL: https://zhlaaaysvzqixnugqbna.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InpobGFhYXlzdnpxaXhudWdxYm5hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTE0MDYwOTUsImV4cCI6MjA2Njk4MjA5NX0.oS03M7cfw3JiQObDL5uwvTPc1F54awaOfdmqUBcIVTc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate manual deploy configuration
        shell: bash
        run: |
          test -n "$NETLIFY_SITE_ID" || (echo "Set repository variable NETLIFY_SITE_ID for the official Netlify project." && exit 1)
          test -n "$NETLIFY_AUTH_TOKEN" || (echo "Set NETLIFY_AUTH_TOKEN only if manual fallback deployment is needed." && exit 1)
      - run: npm ci
      - run: npm run build
      - name: Deploy current main to production
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=dist \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Manual fallback production deploy"
